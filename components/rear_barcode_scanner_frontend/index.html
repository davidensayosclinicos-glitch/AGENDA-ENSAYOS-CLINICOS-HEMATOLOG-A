<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rear Barcode Scanner</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7fbff;
      --panel: #ffffff;
      --text: #1f2937;
      --accent: #0f766e;
      --warn: #b45309;
      --err: #b91c1c;
      --line: #dbe4ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .wrap {
      padding: 10px;
      display: grid;
      gap: 8px;
    }
    .label { font-size: 0.92rem; font-weight: 600; }
    .video-box {
      border: 1px solid var(--line);
      background: #0b1220;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      min-height: 220px;
      display: grid;
      place-items: center;
    }
    video {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border: 2px dashed rgba(255,255,255,.45);
      margin: 16% 10%;
      border-radius: 8px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 8px 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .status { font-size: 0.85rem; }
    .status.ok { color: var(--accent); }
    .status.warn { color: var(--warn); }
    .status.err { color: var(--err); }
    .manual {
      display: none;
      gap: 6px;
      grid-template-columns: 1fr auto;
    }
    .manual input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="label" class="label">Escaner</div>
    <div class="video-box">
      <video id="video" autoplay playsinline muted></video>
      <div class="overlay"></div>
    </div>
    <div class="row">
      <button id="start" class="primary">Iniciar camara trasera</button>
      <button id="stop">Detener</button>
    </div>
    <div id="status" class="status">Esperando inicio...</div>
    <div id="manual" class="manual">
      <input id="manualInput" placeholder="Codigo manual" />
      <button id="sendManual">Enviar</button>
    </div>
  </div>

  <script>
    const Streamlit = {
      API_VERSION: 1,
      RENDER_EVENT: "streamlit:render",
      events: new EventTarget(),
      _registered: false,
      _send(type, data) {
        window.parent.postMessage(
          {
            isStreamlitMessage: true,
            type,
            ...data,
          },
          "*"
        );
      },
      _onMessage(event) {
        const data = event && event.data ? event.data : {};
        if (!data || !data.type) return;
        if (data.type === Streamlit.RENDER_EVENT) {
          const evt = new CustomEvent(Streamlit.RENDER_EVENT, { detail: data });
          Streamlit.events.dispatchEvent(evt);
        }
      },
      setComponentReady() {
        if (!Streamlit._registered) {
          window.addEventListener("message", Streamlit._onMessage);
          Streamlit._registered = true;
        }
        Streamlit._send("streamlit:componentReady", { apiVersion: Streamlit.API_VERSION });
      },
      setFrameHeight(height) {
        Streamlit._send("streamlit:setFrameHeight", { height: Math.ceil(height || 0) });
      },
      setComponentValue(value) {
        Streamlit._send("streamlit:setComponentValue", { value });
      },
    };

    const video = document.getElementById("video");
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const statusEl = document.getElementById("status");
    const labelEl = document.getElementById("label");
    const manualBox = document.getElementById("manual");
    const manualInput = document.getElementById("manualInput");
    const sendManualBtn = document.getElementById("sendManual");

    let stream = null;
    let scanning = false;
    let detector = null;
    let textDetector = null;
    let lastValue = "";
    let lastText = "";
    let frameTick = 0;

    function setStatus(msg, cls = "") {
      statusEl.textContent = msg;
      statusEl.className = "status" + (cls ? " " + cls : "");
    }

    function sendPayload(payload) {
      const code = String(payload?.code || "").trim();
      const text = String(payload?.text || "").trim();
      const key = code + "::" + text;
      if (!code && !text) return;
      if (key === lastValue) return;
      lastValue = key;
      Streamlit.setComponentValue({
        code,
        text,
        source: payload?.source || "unknown",
      });
      if (code) {
        setStatus("Codigo detectado: " + code, "ok");
      } else {
        setStatus("Texto detectado: " + text, "ok");
      }
    }

    async function stopCamera() {
      scanning = false;
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;
      setStatus("Camara detenida.", "warn");
    }

    async function startCamera() {
      await stopCamera();
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        setStatus("Camara trasera activa. Enfoca el codigo.", "ok");
      } catch (err) {
        setStatus("No se pudo abrir camara trasera. Usa codigo manual.", "err");
        manualBox.style.display = "grid";
        return;
      }

      if ("BarcodeDetector" in window) {
        try {
          detector = new BarcodeDetector({
            formats: ["code_128", "code_39", "ean_13", "ean_8", "upc_a", "upc_e", "qr_code"]
          });
        } catch (err) {
          detector = new BarcodeDetector();
        }
      } else {
        detector = null;
        manualBox.style.display = "grid";
        setStatus("Este navegador no soporta deteccion nativa. Usa codigo manual.", "warn");
      }

      if ("TextDetector" in window) {
        try {
          textDetector = new TextDetector();
        } catch (err) {
          textDetector = null;
        }
      }

      scanning = true;
      scanLoop();
    }

    async function detectTextEveryFrames() {
      if (!textDetector) return;
      if ((frameTick % 8) !== 0) return;
      try {
        const blocks = await textDetector.detect(video);
        if (blocks && blocks.length) {
          const joined = blocks
            .map(b => String(b.rawValue || "").trim())
            .filter(Boolean)
            .join(" ")
            .trim();
          if (joined && joined !== lastText) {
            lastText = joined;
            sendPayload({ code: "", text: joined, source: "text" });
          }
        }
      } catch (err) {
      }
    }

    async function scanLoop() {
      if (!scanning) return;
      frameTick += 1;
      if (detector) {
        try {
          const detections = await detector.detect(video);
          if (detections && detections.length > 0) {
            const raw = detections[0].rawValue || "";
            if (raw) {
              sendPayload({ code: raw, text: lastText, source: "barcode" });
            }
          }
        } catch (err) {
        }
      }
      await detectTextEveryFrames();
      requestAnimationFrame(scanLoop);
    }

    function onRender(event) {
      const args = event?.detail?.args || {};
      if (args.label) {
        labelEl.textContent = args.label;
      }
      Streamlit.setFrameHeight(430);
    }

    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);
    sendManualBtn.addEventListener("click", () => {
      sendPayload({ code: manualInput.value, text: "", source: "manual" });
    });

    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
    Streamlit.setComponentReady();
    Streamlit.setFrameHeight(430);
  </script>
</body>
</html>
